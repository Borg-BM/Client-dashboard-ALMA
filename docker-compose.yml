services:
  alma:
    build: .
    image: alma-dashboard:local
    restart: unless-stopped
    # All settings are in .env (copy .env.example); that file is deliberately not in git.
    # Optional (Compose 2.24+): in Portainer .env is missing and Portainer writes the stack variables
    # to stack.env next to this file; that file passes them on to the container.
    env_file:
      - path: .env
        required: false
      - path: stack.env
        required: false
    ports:
      # Reachable on the host itself only. Put a reverse proxy with TLS in front of this
      # (see README); never publish this port directly on the internet.
      - "127.0.0.1:8000:8000"
      # UDP telegrams from iba (only needed with ALMA_SOURCE=udp). Localhost only by default: the ibaPDA
      # is in a VPN with the server, so set ALMA_UDP_PUBLISH to the server's IP in that tunnel. Never publish
      # this port on a public address. Same port number inside and outside the container.
      - "${ALMA_UDP_PUBLISH:-127.0.0.1}:${ALMA_UDP_PORT:-5005}:${ALMA_UDP_PORT:-5005}/udp"
    # The bind mounts of secrets/, signals.json and udp_format.json are in docker-compose.override.yml
    # (docker compose reads it automatically). Portainer only uses this file: relative paths
    # do not exist on the host there and would be created as empty directories. The image contains the
    # same default files.
    # The app writes nothing to disk, so the filesystem can be read-only.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
