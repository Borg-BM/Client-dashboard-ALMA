# Merged automatically with docker-compose.yml by `docker compose`. Portainer does not read this
# file: there the default files from the image apply.
services:
  alma:
    volumes:
      # ibaHD quick-connect.json (only needed with ALMA_SOURCE=ibahd), the signal map and the UDP telegram format.
      - ./secrets:/app/secrets:ro
      - ./signals.json:/app/signals.json:ro
      - ./udp_format.json:/app/udp_format.json:ro
